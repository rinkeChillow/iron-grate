# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Shared across the whole yarn layer.
# A Gradle plugin version is resolved once per build, so loom_version CANNOT vary
# per Minecraft version - see STONECUTTER-NOTES.md gotcha 1.
loom_version=1.15-SNAPSHOT

# Mod Properties
maven_group=com.rinke_.irongrate
archives_base_name=irongrate

# Per-version values (minecraft_version, yarn_mappings, loader_version,
# fabric_version, mod_version, minecraft_range) live in versions/<ver>/gradle.properties
